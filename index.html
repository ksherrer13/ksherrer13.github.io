<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 30px;
        }
        .post-card {
            margin-bottom: 20px;
        }
        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Social Media Scheduler</h1>
        <div class="row">
            <!-- Loop through up to 5 post slots -->
            {% for i in range(5) %}
            <div class="col-md-6">
                <div class="card post-card">
                    <div class="card-header">
                        <h5 class="card-title">Post Slot {{ i + 1 }}</h5>
                    </div>
                    <div class="card-body">
                        <form id="post-form-{{ i }}" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="content-{{ i }}" class="form-label">Post Content</label>
                                <textarea id="content-{{ i }}" name="content" class="form-control" rows="4" placeholder="Enter your post content here"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="platforms-{{ i }}" class="form-label">Select Platforms</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="platform" value="facebook" id="facebook-{{ i }}">
                                    <label class="form-check-label" for="facebook-{{ i }}">Facebook</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="platform" value="google_business" id="google-{{ i }}">
                                    <label class="form-check-label" for="google-{{ i }}">Google Business</label>
                                </div>
                                <!-- Add placeholders for other platforms -->
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="platform" value="twitter" id="twitter-{{ i }}">
                                    <label class="form-check-label" for="twitter-{{ i }}">Twitter</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="image-{{ i }}" class="form-label">Attach Image</label>
                                <input type="file" id="image-{{ i }}" name="image" class="form-control">
                                <img id="preview-{{ i }}" class="image-preview d-none">
                            </div>
                            <div class="mb-3">
                                <label for="scheduled-time-{{ i }}" class="form-label">Schedule Time</label>
                                <input type="datetime-local" id="scheduled-time-{{ i }}" name="scheduled_time" class="form-control">
                            </div>
                            <button type="button" class="btn btn-primary w-100" onclick="submitPost({{ i }})">Submit</button>
                        </form>
                    </div>
                    <div class="card-footer">
                        <small id="log-{{ i }}" class="text-muted">No actions yet for this post.</small>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script>
        function submitPost(slot) {
            const form = document.getElementById(`post-form-${slot}`);
            const formData = new FormData(form);
            fetch('/submit_post', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const log = document.getElementById(`log-${slot}`);
                if (data.message) {
                    log.textContent = `Success: ${data.message}`;
                } else if (data.error) {
                    log.textContent = `Error: ${data.error}`;
                }
            })
            .catch(error => {
                const log = document.getElementById(`log-${slot}`);
                log.textContent = `Error: ${error.message}`;
            });
        }
    
        // Image preview
        document.querySelectorAll('input[type="file"]').forEach((input, i) => {
            input.addEventListener('change', event => {
                const file = event.target.files[0];
                const preview = document.getElementById(`preview-${i}`);
                if (file) {
                    preview.src = URL.createObjectURL(file);
                    preview.classList.remove('d-none');
                } else {
                    preview.classList.add('d-none');
                }
            });
        });
    </script>    
</body>
</html>
